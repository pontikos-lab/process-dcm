[project]
name = "process-dcm"
version = "1.0.0"
description = "Python library and app to extract images from DCM in a JSON-based standard format"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alan Wilter", email = "alan.wilter@eye2gene.com" },
  { name = "Eye2Gene", email = "dev@eye2gene.com" },
]
maintainers = [{ name = "Eye2Gene", email = "dev@eye2gene.com" }]
keywords = ["dicom", "image-extraction", "metadata", "oct", "ophthalmology"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.12.0.88",
  "pillow>=11.3.0",
  "pydicom>=3.0.1",
  "python-gdcm>=3.0.25",
  "rich>=13.0",
  "typer>=0.16.0",
]

[project.urls]
changelog = "https://github.com/eye2Gene/process-dcm/blob/main/CHANGELOG.md"
documentation = "https://github.com/eye2Gene/process-dcm#readme"
homepage = "https://github.com/eye2Gene/process-dcm"
issues = "https://github.com/eye2Gene/process-dcm/issues"
repository = "https://github.com/eye2Gene/process-dcm"

[project.scripts]
process-dcm = "process_dcm.main:cli"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "tools" },
]
lint = [
  "licensecheck",
  "ruff",
]
test = [
  "ipdb",
  "pdbpp",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-xdist",
  "ty",
]
tools = ["cruft", "rust-just"]

[build-system]
requires = ["uv_build>=0.9.0,<1.0"]
build-backend = "uv_build"

[tool.coverage.report]
omit = ["__main__.py"]
fail_under = 90  # minimum coverage required, but aim for 100% though
exclude_also = [
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@overload",
  "@typing.overload",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "no cov",
  "if __name__ == .__main__.:",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov=src/",
  "--cov=tests/",
  "--dist=loadscope",
  "--durations=5",
  "-n",
  "auto",  # parallel by default (template default is 0); `just pdb` forces -n 0
]
filterwarnings = []
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"  # lowest supported version; move to py312 once all Eye2Gene consumers are on 3.12
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ANN",  # check typings
  "B",  # flake8-bugbear
  "D",  # check docstrings
  "E",  # pycodestyle errors
  "F",  # Pyflakes
  "I",  # isort
  "RUF",  # Ruff-specific rules
  "SIM",  # Common simplification rules
  "TC",  # Enforce importing certain types in a TYPE_CHECKING block
  "TD",  # Be diligent with TODO comments
  "TID",  # Some good import practices
  "UP",  # Warn if certain things can changed due to newer Python versions
  "W",  # PyCodeStyle warnings
  "S",  # security issues
]
ignore = [
  "E501",  # line length (handled by ruff format for code)
  "B008",  # function call in defaults (standard typer pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S"]  # ["UP", "RUF", "I", "D", "E501"]
"__main__.py" = ["D100"]
"__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
# Put the new version in uv.lock too, inside the release commit. It runs in the semantic-release action's
# container, which has no uv; keep the uv range the same as [tool.uv] required-version.
build_command = """
    python -m pip install --quiet "uv>=0.12,<1.0"
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""

[tool.semantic_release.changelog]
exclude_commit_patterns = ['^chore: update coverage badge \[skip ci\]$']

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src"]

[tool.ty.terminal]
error-on-warning = true

[tool.uv]
required-version = ">=0.12,<1.0"
exclude-newer = "7 days"
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }  # certifi: PYSEC-2026-4320 fix, drop it after 2026-10-27
package = true
default-groups = ["dev"]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } }
]
