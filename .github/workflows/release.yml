name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # needed for PyPI trusted publishing

jobs:
  ci:
    uses: eye2Gene/e2g-workflows/.github/workflows/python-ci.yml@main
    with:
      # process-dcm supports 3.11+ (the reusable default is 3.12/3.13 only)
      python-versions: '["3.11", "3.12", "3.13"]'

  release:
    runs-on: ubuntu-latest
    needs: [ci]
    outputs:
      released: ${{ steps.release.outputs.released }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset to the tested commit
        run: git reset --hard "$GITHUB_SHA"

      - uses: astral-sh/setup-uv@main

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package
        if: steps.release.outputs.released == 'true'
        run: uv run just build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload to GitHub Release assets
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  coverage-badge:
    runs-on: ubuntu-latest
    needs: [ci, release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@main

      # The ci job already produced coverage.xml and uploaded it as an artifact, so
      # pull it here instead of re-running the suite, then render it to a
      # self-contained SVG committed into the repo. The README references
      # assets/coverage.svg by relative path so it renders for anyone who can see
      # the repo, without a third party.
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-3.12

      - name: Render coverage badge
        run: |
          mkdir -p assets
          uvx --from "genbadge[coverage]" genbadge coverage -i coverage.xml -o assets/coverage.svg -s

      - name: Commit coverage badge if it changed
        env:
          RELEASED: ${{ needs.release.outputs.released }}
          RELEASE_COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            expected_tip="$RELEASE_COMMIT_SHA"
          else
            expected_tip="$TRIGGER_SHA"
          fi
          if [ -z "$expected_tip" ]; then
            echo "Expected branch tip is empty."
            exit 1
          fi

          git fetch origin main
          current_tip="$(git rev-parse origin/main)"
          if [ "$current_tip" != "$expected_tip" ]; then
            echo "Skipping stale coverage badge: origin/main is $current_tip, expected $expected_tip."
            exit 0
          fi
          # Staged first: a badge the repo does not have yet is untracked, and git diff would not see it
          git add assets/coverage.svg
          if git diff --cached --quiet -- assets/coverage.svg; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update coverage badge [skip ci]"
          if ! git push origin HEAD:main; then
            git fetch origin main
            current_tip="$(git rev-parse origin/main)"
            if [ "$current_tip" != "$expected_tip" ]; then
              echo "Skipping stale coverage badge after origin/main advanced to $current_tip."
              exit 0
            fi
            echo "Coverage badge push failed while origin/main remained at $expected_tip."
            exit 1
          fi
